name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Fetch the real inference engine so it's compiled into the APK.
      # End users never do this — it happens here in CI.
      - name: Fetch llama.cpp (real inference backend)
        run: |
          if [ ! -d app/src/main/cpp/llama.cpp/.git ]; then
            git clone --depth 1 https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp
          fi
          echo "llama.cpp at: $(cd app/src/main/cpp/llama.cpp && git rev-parse --short HEAD)"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: localai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
