<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SkyGrid — Isometric City Builder (React)</title>
<meta name="description" content="Build your dream city in stunning isometric 3D. Now powered by React.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e1a">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0a0e1a;--glass:rgba(15,23,42,0.78);--glass-b:rgba(148,163,184,0.12);
    --glass-h:rgba(30,41,59,0.88);--accent:#38bdf8;--accent-g:rgba(56,189,248,0.3);
    --ok:#34d399;--warn:#fbbf24;--err:#f87171;--text:#f1f5f9;--dim:#94a3b8;
    --mute:#64748b;--gold:#f59e0b;--purple:#a78bfa;
  }
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;width:100vw;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;position:fixed;inset:0}
  canvas#gameCanvas{display:block;position:absolute;top:0;left:0;touch-action:none}
  #root button{touch-action:manipulation}
  #dayNightOverlay{position:fixed;inset:0;pointer-events:none;z-index:50;transition:background 1.2s ease}
  #brownout{position:fixed;inset:0;pointer-events:none;z-index:51;background:rgba(120,20,20,0);transition:background .6s}
  #brownout.active{background:rgba(120,20,20,0.10)}
  #brownout.crisis{background:rgba(150,15,15,0.22);animation:crisisPulse 1.4s infinite}
  @keyframes crisisPulse{0%,100%{background:rgba(150,15,15,0.14)}50%{background:rgba(175,25,25,0.30)}}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:48;background:radial-gradient(ellipse 75% 75% at 50% 45%, transparent 60%, rgba(0,0,0,0.30) 100%)}
  #sandboxBorder{position:fixed;inset:0;pointer-events:none;z-index:49;border:2px solid transparent;transition:border-color .5s}
  #sandboxBorder.active{border-color:rgba(245,158,11,.25);box-shadow:inset 0 0 60px rgba(245,158,11,.06)}
  #root{position:relative;z-index:100;pointer-events:none}
  #root button, #root input, #root .pointer, #root .building-card{pointer-events:auto}

  /* TITLE */
  .gameTitle{position:fixed;top:18px;left:24px;display:flex;align-items:center;gap:10px}
  .gameTitle h1{font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.5px}
  .version{font-size:10px;color:var(--mute);background:rgba(255,255,255,.06);padding:2px 8px;border-radius:6px;font-weight:600}
  .badge-sandbox{font-size:10px;color:var(--gold);background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.25);padding:2px 10px;border-radius:6px;font-weight:700;letter-spacing:1px;text-transform:uppercase;animation:pulse-gold 2s infinite}
  @keyframes pulse-gold{0%,100%{box-shadow:0 0 4px rgba(245,158,11,.2)}50%{box-shadow:0 0 12px rgba(245,158,11,.4)}}

  /* TOP BAR */
  .topBar{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:8px 14px;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-b);border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
  .resource{display:flex;align-items:center;gap:7px;padding:6px 14px;border-radius:10px;background:rgba(255,255,255,.03);transition:background .2s;min-width:96px}
  .resource:hover{background:rgba(255,255,255,.06)}
  .resource-icon{font-size:18px;width:24px;text-align:center}
  .resource-label{font-size:9px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mute);font-weight:700}
  .resource-value{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;transition:color .3s}

  /* CONTROLS */
  .controls{position:fixed;top:18px;right:24px;display:flex;gap:8px}
  .ctrl-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--glass-b);background:var(--glass);backdrop-filter:blur(20px);color:var(--dim);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s;box-shadow:0 4px 16px rgba(0,0,0,.3)}
  .ctrl-btn:hover{background:var(--glass-h);color:var(--text);transform:translateY(-1px)}
  .ctrl-btn.active{background:rgba(56,189,248,.15);border-color:rgba(56,189,248,.3);color:var(--accent)}
  .ctrl-btn.sandbox-on{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.3);color:var(--gold)}

  /* SPEED */
  .speedBar{position:fixed;top:66px;right:24px;display:flex;gap:4px;padding:4px;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-b);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
  .speed-btn{min-width:34px;height:30px;border-radius:8px;border:none;background:transparent;color:var(--dim);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
  .speed-btn:hover{background:rgba(255,255,255,.06);color:var(--text)}
  .speed-btn.active{background:rgba(56,189,248,.15);color:var(--accent)}

  /* SAVE MENU */
  .saveMenu{position:fixed;top:66px;right:24px;background:var(--glass);backdrop-filter:blur(24px);border:1px solid var(--glass-b);border-radius:14px;padding:8px;box-shadow:0 12px 40px rgba(0,0,0,.5);min-width:210px;z-index:160}
  .save-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border:none;border-radius:8px;background:transparent;color:var(--dim);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;text-align:left}
  .save-btn:hover{background:rgba(255,255,255,.06);color:var(--text)}
  .sb-icon{font-size:16px;width:22px;text-align:center}
  .save-divider{height:1px;background:var(--glass-b);margin:4px 8px}

  /* BOTTOM PANEL */
  .bottomPanel{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;width:auto}
  .paletteTop{display:flex;gap:8px;align-items:center}
  .categoryTabs{display:flex;gap:4px;padding:4px;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-b);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
  .cat-tab{padding:8px 14px;border-radius:8px;border:none;background:transparent;color:var(--dim);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .cat-tab:hover{background:rgba(255,255,255,.06);color:var(--text)}
  .cat-tab.active{background:rgba(56,189,248,.12);color:var(--accent)}
  .searchBox{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-b);border-radius:12px;padding:8px 12px;color:var(--text);font-family:'Inter';font-size:12px;width:150px;outline:none}
  .searchBox::placeholder{color:var(--mute)}
  .searchBox:focus{border-color:var(--accent-g)}
  .buildingCards{display:flex;gap:8px;padding:10px 14px;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-b);border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.4);max-width:92vw;overflow-x:auto}
  .building-card{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 12px;border-radius:12px;border:1px solid transparent;background:rgba(255,255,255,.03);cursor:pointer;transition:all .15s;min-width:78px;position:relative}
  .building-card:hover{background:rgba(255,255,255,.07);border-color:var(--glass-b);transform:translateY(-2px)}
  .building-card.selected{background:rgba(56,189,248,.1);border-color:rgba(56,189,248,.3);box-shadow:0 0 20px rgba(56,189,248,.15)}
  .building-card.disabled{opacity:.4;cursor:not-allowed}
  .building-card .icon{font-size:26px;height:34px;display:flex;align-items:center}
  .building-card .name{font-size:10px;font-weight:600;color:var(--dim);text-align:center;white-space:nowrap}
  .building-card .cost{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600}

  /* TOOLTIP */
  .tooltip{position:fixed;padding:12px 16px;background:rgba(15,23,42,.96);backdrop-filter:blur(20px);border:1px solid var(--glass-b);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:200;pointer-events:none;max-width:230px}
  .tt-name{font-weight:700;font-size:13px;margin-bottom:4px}
  .tt-desc{font-size:11px;color:var(--dim);line-height:1.4;margin-bottom:8px}
  .tt-stats{display:flex;flex-wrap:wrap;gap:6px}
  .tt-stat{font-size:10px;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.06);font-family:'JetBrains Mono',monospace}

  /* TOASTS */
  .toastWrap{position:fixed;top:74px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:300;pointer-events:none}
  .toast{padding:9px 18px;border-radius:12px;font-size:13px;font-weight:600;backdrop-filter:blur(20px);border:1px solid var(--glass-b);animation:toastIn .3s cubic-bezier(.34,1.56,.64,1)}
  @keyframes toastIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
  .toast.error{background:rgba(248,113,113,.16);color:var(--err);border-color:rgba(248,113,113,.25)}
  .toast.success{background:rgba(52,211,153,.16);color:var(--ok);border-color:rgba(52,211,153,.25)}
  .toast.info{background:rgba(56,189,248,.16);color:var(--accent);border-color:rgba(56,189,248,.25)}
  .toast.gold{background:rgba(245,158,11,.16);color:var(--gold);border-color:rgba(245,158,11,.25)}

  /* MINIMAP */
  .minimap{position:fixed;bottom:172px;right:20px;width:150px;height:100px;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-b);border-radius:12px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.3)}
  .minimap canvas{width:100%;height:100%}

  /* STATS + DEMAND */
  .statsPanel{position:fixed;bottom:172px;left:20px;padding:14px 18px;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-b);border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.3);min-width:172px}
  .stat-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0}
  .stat-row .label{font-size:11px;color:var(--mute);font-weight:600}
  .stat-row .val{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--dim)}
  .demand{margin-top:8px;padding-top:8px;border-top:1px solid var(--glass-b)}
  .demand-row{display:flex;align-items:center;gap:8px;padding:2px 0}
  .demand-row .dl{font-size:10px;font-weight:700;width:16px;color:var(--dim)}
  .demand-bar{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden}
  .demand-fill{height:100%;border-radius:4px;transition:width .5s}

  /* ACHIEVEMENTS */
  .achPanel{position:fixed;top:118px;left:24px;display:flex;flex-direction:column;gap:6px;max-width:230px}
  .ach{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-b);border-radius:10px;font-size:11px;font-weight:600;color:var(--gold);box-shadow:0 4px 16px rgba(0,0,0,.3);animation:toastIn .4s cubic-bezier(.34,1.56,.64,1)}

  /* HELP */
  .helpOverlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:500;display:flex;align-items:center;justify-content:center}
  .helpContent{background:#111827;border:1px solid var(--glass-b);border-radius:20px;padding:32px 40px;max-width:500px;box-shadow:0 16px 64px rgba(0,0,0,.5)}
  .helpContent h2{font-size:20px;font-weight:800;margin-bottom:16px;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .helpContent p{font-size:13px;color:var(--dim);line-height:1.7;margin-bottom:8px}
  .helpContent kbd{display:inline-block;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-family:'JetBrains Mono',monospace;font-size:11px;margin:0 2px}
  .close-help{margin-top:16px;padding:10px 24px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--accent),#818cf8);color:#fff;font-weight:700;font-size:13px;cursor:pointer;transition:transform .2s,box-shadow .2s}
  .close-help:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(56,189,248,.4)}

  /* ALERT BANNER */
  .alertBanner{position:fixed;top:118px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:140;width:max-content;max-width:90vw}
  .alert{display:flex;align-items:center;gap:8px;padding:8px 18px;border-radius:12px;font-size:13px;font-weight:700;backdrop-filter:blur(20px);box-shadow:0 6px 24px rgba(0,0,0,.4)}
  .alert.protest{background:rgba(248,113,113,.18);color:#fca5a5;border:1px solid rgba(248,113,113,.35);animation:toastIn .3s}
  .alert.crisis{background:rgba(180,20,20,.28);color:#fecaca;border:1px solid rgba(248,113,113,.5);animation:crisisPulse 1.2s infinite}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
  .buildingCards,.categoryTabs{-webkit-overflow-scrolling:touch}

  /* mobile-only on-screen zoom / recenter cluster (hidden on desktop) */
  .mobileNav{display:none}
  .mnav-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--glass-b);background:var(--glass);backdrop-filter:blur(20px);color:var(--text);font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.35);line-height:1}
  .mnav-btn:active{background:var(--glass-h);transform:scale(.94)}

  /* ============ RESPONSIVE / MOBILE ============ */
  @media (max-width:820px){
    /* TOP: title → resources → controls, stacked full-width so nothing is hidden */
    .gameTitle{top:6px;left:8px;gap:6px}
    .gameTitle h1{font-size:15px}
    .version{display:none}
    .badge-sandbox{padding:2px 6px;font-size:9px}
    .topBar{top:30px;left:8px;right:8px;transform:none;justify-content:flex-start;gap:3px;padding:5px 8px;border-radius:12px;overflow-x:auto;max-width:none}
    .resource{min-width:auto;padding:4px 9px;gap:5px;flex:0 0 auto}
    .resource-icon{font-size:15px;width:18px}
    .resource-label{font-size:8px;letter-spacing:.5px}
    .resource-value{font-size:12px}
    .controls{top:78px;left:8px;right:8px;gap:5px;justify-content:flex-start;overflow-x:auto;padding-bottom:2px}
    .ctrl-btn{width:34px;height:34px;min-width:34px;font-size:15px;border-radius:10px;flex:0 0 auto}
    .saveMenu{top:120px;right:8px;min-width:190px}
    /* mid-right floating zoom cluster */
    .mobileNav{display:flex;flex-direction:column;gap:8px;position:fixed;right:8px;top:50%;transform:translateY(-50%);z-index:130}
    /* BOTTOM: shrunk minimap + stats kept visible, above the palette */
    .minimap{width:104px;height:70px;bottom:144px;right:8px;border-radius:10px}
    .statsPanel{left:8px;bottom:144px;min-width:0;padding:9px 11px;border-radius:11px}
    .statsPanel .stat-row{padding:2px 0}
    .statsPanel .label{font-size:9px}
    .statsPanel .val{font-size:10px}
    .statsPanel .dl{font-size:9px;width:13px}
    .statsPanel .demand{margin-top:6px;padding-top:6px}
    .demand-bar{height:6px}
    .speedBar{top:auto;bottom:222px;right:8px;left:auto}
    .achPanel{top:118px;left:8px;max-width:60vw}
    .alertBanner{top:118px;max-width:84vw}
    .alert{font-size:11px;padding:6px 12px}
    .bottomPanel{bottom:calc(6px + env(safe-area-inset-bottom));gap:6px;max-width:100vw}
    .categoryTabs{overflow-x:auto;max-width:96vw}
    .cat-tab{padding:7px 11px;font-size:11px}
    .searchBox{width:104px}
    .buildingCards{max-width:96vw;padding:8px 10px;gap:6px}
    .building-card{min-width:66px;padding:7px 9px}
    .building-card .icon{font-size:22px;height:28px}
    .toastWrap{top:118px}
    .helpContent{max-width:90vw;max-height:84vh;overflow-y:auto;padding:24px 22px;border-radius:16px}
    .helpContent h2{font-size:17px}
    .helpContent p{font-size:12px;line-height:1.6}
  }
  @media (max-width:520px){
    .gameTitle h1{font-size:14px}
    .topBar{gap:2px;padding:5px 6px}
    .resource{padding:3px 7px}
    .ctrl-btn{width:32px;height:32px;min-width:32px;font-size:14px}
    .minimap{width:90px;height:60px;bottom:138px}
    .statsPanel{bottom:138px;padding:8px 9px}
    .statsPanel .label{font-size:8px}
    .statsPanel .val{font-size:9px}
    .speedBar{bottom:208px}
    .mnav-btn{width:38px;height:38px;font-size:18px}
    .cat-tab{padding:7px 9px}
    .searchBox{width:84px}
    .achPanel{max-width:52vw}
  }
  @media (max-height:480px) and (orientation:landscape){
    .gameTitle{display:none}
    .topBar{top:8px;left:64px;right:64px}
    .controls{top:46px;left:64px;right:64px}
    .achPanel{display:none}
    .minimap{bottom:128px}
    .statsPanel{bottom:128px}
    .speedBar{bottom:128px;right:120px}
    .helpContent{max-height:92vh}
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="dayNightOverlay"></div>
<div id="brownout"></div>
<div id="vignette"></div>
<div id="sandboxBorder"></div>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/jsx-app" id="appCode">
const { useState, useEffect, useRef, useSyncExternalStore } = React;

// ============================================================
// CONSTANTS
// ============================================================
const G = 80, TW = 64, TH = 32, HW = TW/2, HH = TH/2;

// ============================================================
// STATE
// ============================================================
const S = {
  grid: [], camera:{ x:0, y:0, zoom:1 },
  res:{ money:5000, pop:0, popCap:0, happy:50, baseHappy:50, energy:0, income:0, water:0, waterProd:0 },
  dying:false, deathTimer:0,
  sel:null, hover:null, showGrid:true, soundOn:true,
  isNight:false, autoCycle:false, time:0, incTimer:0, sandbox:false,
  undoStack:[], bCount:0, particles:[], clouds:[], people:[],
  isPanning:false, panS:{x:0,y:0}, camS:{x:0,y:0}, keys:{},
  isBuilding:false, expansions:0, mmDirty:true,
  speed:1, powerRatio:1, achieved:{}, demand:{r:0.5,c:0.5,i:0.5},
  // — events & crisis —
  happyMod:0, protesters:[], protestTimer:0, protestActive:false,
  crisis:false, crisisTimer:0, hoverB:null, lastHoverKey:-1,
  units:[], molotovs:[], hoverUnit:null
};

let canvas, ctx, mmCanvas, mmCtx, mmBgCanvas, mmBgCtx;
// logical (CSS-pixel) viewport size — kept separate from the canvas backing store so the
// backing store can be scaled up for crisp rendering on high-DPI / mobile screens.
let VW = window.innerWidth, VH = window.innerHeight;
const IS_TOUCH = (typeof matchMedia==='function' && matchMedia('(pointer:coarse)').matches) || ('ontouchstart' in window);

// ============================================================
// PUB/SUB for React HUD
// ============================================================
const listeners = new Set();
let snapshot = {};
let toastSeq = 0;
let toasts = [];
let achievementsShown = [];

function buildSnapshot(){
  snapshot = {
    money:S.res.money, pop:Math.round(S.res.pop), popCap:S.res.popCap,
    happy:S.res.happy, energy:S.res.energy, income:S.res.income,
    bCount:S.bCount, expansions:S.expansions, tiles:getUnlockedCount(),
    isNight:S.isNight, autoCycle:S.autoCycle, zoom:S.camera.zoom,
    sandbox:S.sandbox, sel:S.sel, soundOn:S.soundOn, showGrid:S.showGrid,
    speed:S.speed, powerRatio:S.powerRatio, demand:{...S.demand},
    toasts:[...toasts], achievements:[...achievementsShown],
    protesters:S.protesters.length, protestActive:S.protestActive, crisis:S.crisis,
    hoverB:S.hoverB, water:S.res.water, dying:S.dying,
    hoverUnit: (S.hoverUnit && S.hoverUnit.life>0 && canvas) ? { kind:S.hoverUnit.kind, life:Math.ceil(S.hoverUnit.life), x:g2s(S.hoverUnit.px,S.hoverUnit.py).x, y:g2s(S.hoverUnit.px,S.hoverUnit.py).y } : null,
    units:S.units.length
  };
}
function emit(){ buildSnapshot(); listeners.forEach(l=>l()); }
function subscribe(cb){ listeners.add(cb); return ()=>listeners.delete(cb); }
function getSnapshot(){ return snapshot; }

// ============================================================
// MAP GENERATION & UNLOCKS
// ============================================================
const unlockSeq = [];
(function buildUnlockSequence(){
  const cx=Math.floor(G/2), cy=Math.floor(G/2), remaining=[];
  for(let r=0;r<G;r++) for(let c=0;c<G;c++){
    const dist=Math.hypot(c-cx,r-cy);
    const isCenter = r>=cy-12 && r<cy+12 && c>=cx-12 && c<cx+12;
    remaining.push({c,r,dist,isCenter});
  }
  remaining.sort((a,b)=> a.isCenter!==b.isCenter ? (a.isCenter?-1:1) : a.dist-b.dist);
  remaining.forEach(t=>unlockSeq.push({c:t.c,r:t.r}));
})();
const unlockIndex = {};
unlockSeq.forEach((t,i)=>{ unlockIndex[t.r*G+t.c]=i; });

function getUnlockedCount(){ return 576 + S.expansions*50; }
function isLocked(c,r){ return unlockIndex[r*G+c] >= getUnlockedCount(); }

function initGrid(){
  S.grid=[];
  for(let r=0;r<G;r++){ S.grid[r]=[]; for(let c=0;c<G;c++) S.grid[r][c]={ b:null, t:'grass', anim:0 }; }
  let rY=Math.floor(G/2)+Math.floor(Math.random()*6-3);
  for(let c=0;c<G;c++){
    S.grid[rY][c].t='water';
    if(rY+1<G) S.grid[rY+1][c].t='water';
    if(rY-1>=0 && Math.random()<0.5) S.grid[rY-1][c].t='water';
    if(Math.random()<0.25) rY++; else if(Math.random()<0.25) rY--;
    rY=Math.max(2,Math.min(G-3,rY));
  }
  for(let i=0;i<6;i++){
    const pc=Math.floor(Math.random()*(G-10)+5), pr=Math.floor(Math.random()*(G-10)+5), radius=Math.floor(Math.random()*3+2);
    for(let r=-radius;r<=radius;r++) for(let c=-radius;c<=radius;c++)
      if(r*r+c*c<=radius*radius*(0.8+Math.random()*0.4) && pr+r>=0&&pr+r<G&&pc+c>=0&&pc+c<G)
        S.grid[pr+r][pc+c].t='water';
  }
  S.mmDirty=true;
}
initGrid();

let aCtx=null;
function initA(){ if(!aCtx) aCtx=new (window.AudioContext||window.webkitAudioContext)(); }
function snd(type){
  if(!S.soundOn||!aCtx) return;
  try{
    const o=aCtx.createOscillator(),g=aCtx.createGain();o.connect(g);g.connect(aCtx.destination);const t=aCtx.currentTime;
    if(type==='place'){o.type='sine';o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(780,t+.08);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.2)}
    else if(type==='remove'){o.type='sawtooth';o.frequency.setValueAtTime(400,t);o.frequency.exponentialRampToValueAtTime(150,t+.15);g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.2)}
    else if(type==='error'){o.type='square';o.frequency.setValueAtTime(180,t);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.start(t);o.stop(t+.15)}
    else if(type==='select'){o.type='sine';o.frequency.setValueAtTime(600,t);o.frequency.exponentialRampToValueAtTime(800,t+.05);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);o.start(t);o.stop(t+.1)}
    else if(type==='coin'){o.type='sine';o.frequency.setValueAtTime(1200,t);o.frequency.setValueAtTime(1600,t+.06);g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.2)}
    else if(type==='save'){o.type='sine';o.frequency.setValueAtTime(440,t);o.frequency.setValueAtTime(660,t+.1);o.frequency.setValueAtTime(880,t+.2);g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.start(t);o.stop(t+.35)}
    else if(type==='upgrade'){o.type='square';o.frequency.setValueAtTime(300,t);o.frequency.setValueAtTime(600,t+.1);o.frequency.setValueAtTime(900,t+.2);g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.start(t);o.stop(t+.4)}
    else if(type==='achieve'){o.type='triangle';[523,659,784,1046].forEach((f,i)=>{o.frequency.setValueAtTime(f,t+i*.09)});g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.5)}
  }catch(e){}
}

function g2s(c,r){ return { x:(c-r)*HW*S.camera.zoom+S.camera.x+VW/2, y:(c+r)*HH*S.camera.zoom+S.camera.y+VH/2 }; }
function s2g(sx,sy){
  const wx=(sx-VW/2-S.camera.x)/S.camera.zoom, wy=(sy-VH/2-S.camera.y)/S.camera.zoom;
  return { c:Math.floor((wx/HW+wy/HH)/2), r:Math.floor((wy/HH-wx/HW)/2) };
}
function hsl(h,s,l){ return `hsl(${h},${s}%,${l}%)`; }
function hsla(h,s,l,a){ return `hsla(${h},${s}%,${l}%,${a})`; }

function drawBlock(cx, cy, h, col, z, opts={}) {
  const tsc=opts.tsc||1, tw=HW*z*tsc, th=HH*z*tsc, bh=h*z;
  const F=[cx,cy+th], R=[cx+tw,cy], Bk=[cx,cy-th], L=[cx-tw,cy];
  const FT=[cx,cy+th-bh], RT=[cx+tw,cy-bh], BT=[cx,cy-th-bh], LT=[cx-tw,cy-bh];
  ctx.beginPath(); ctx.moveTo(F[0]+3,F[1]+3); ctx.lineTo(R[0]+4,R[1]+2); ctx.lineTo(Bk[0]+3,Bk[1]+1); ctx.lineTo(L[0]+2,L[1]+2); ctx.closePath();
  ctx.fillStyle='rgba(0,0,0,0.12)'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(...F); ctx.lineTo(...L); ctx.lineTo(...LT); ctx.lineTo(...FT); ctx.closePath();
  const lgr=ctx.createLinearGradient(cx-tw,cy,cx,cy); lgr.addColorStop(0,hsl(col.h,col.s,col.l-18)); lgr.addColorStop(1,hsl(col.h,col.s,col.l-12));
  ctx.fillStyle=lgr; ctx.fill(); ctx.strokeStyle=hsla(0,0,0,0.15); ctx.lineWidth=0.5; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(...F); ctx.lineTo(...R); ctx.lineTo(...RT); ctx.lineTo(...FT); ctx.closePath();
  const rgr=ctx.createLinearGradient(cx,cy,cx+tw,cy); rgr.addColorStop(0,hsl(col.h,col.s,col.l-4)); rgr.addColorStop(1,hsl(col.h,col.s,col.l-8));
  ctx.fillStyle=rgr; ctx.fill(); ctx.strokeStyle=hsla(0,0,0,0.15); ctx.lineWidth=0.5; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(...FT); ctx.lineTo(...RT); ctx.lineTo(...BT); ctx.lineTo(...LT); ctx.closePath();
  ctx.fillStyle=hsl(col.h,col.s,col.l+12); ctx.fill(); ctx.strokeStyle=hsla(0,0,0,0.08); ctx.lineWidth=0.5; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(...FT); ctx.lineTo(...F); ctx.strokeStyle=hsla(0,0,100,0.1); ctx.lineWidth=1; ctx.stroke();
  if(opts.win && bh>12){
    const rows=opts.winR||Math.max(1,Math.floor(h/12)), cols=opts.winC||2, nightGlow=S.isNight;
    const winCol=nightGlow?hsla(45,90,75,0.75):hsla(200,60,85,0.3);
    const winDark=nightGlow?hsla(45,70,50,0.5):hsla(210,40,70,0.15);
    const margin=0.15, cellW=(1-margin*2)/cols, cellH=(1-margin*2)/rows, winW=cellW*0.55, winH=cellH*0.55;
    ctx.save(); ctx.transform(tw,-th,0,-bh,cx,cy+th);
    for(let wr=0;wr<rows;wr++) for(let wc=0;wc<cols;wc++){
      const wx=margin+wc*cellW+(cellW-winW)/2, wy=margin+wr*cellH+(cellH-winH)/2;
      ctx.fillStyle=hsla(0,0,0,0.1); ctx.fillRect(wx-0.005,wy-0.005,winW+0.01,winH+0.01);
      const lit=nightGlow&&((wr*7+wc*13+Math.floor(S.time))%3!==0);
      ctx.fillStyle=lit?winCol:winDark; ctx.fillRect(wx,wy,winW,winH);
      if(!nightGlow){ ctx.fillStyle='rgba(255,255,255,0.12)'; ctx.fillRect(wx,wy,winW*0.3,winH); }
    }
    ctx.restore();
    ctx.save(); ctx.transform(-tw,-th,0,-bh,cx,cy+th);
    for(let wr=0;wr<rows;wr++) for(let wc=0;wc<cols;wc++){
      const wx=margin+wc*cellW+(cellW-winW)/2, wy=margin+wr*cellH+(cellH-winH)/2;
      ctx.fillStyle=hsla(0,0,0,0.1); ctx.fillRect(wx-0.005,wy-0.005,winW+0.01,winH+0.01);
      const lit=nightGlow&&((wr*11+wc*3+Math.floor(S.time*0.5))%4!==0);
      ctx.fillStyle=lit?winCol:winDark; ctx.fillRect(wx,wy,winW,winH);
    }
    ctx.restore();
  }
  if(opts.ledge){
    ctx.beginPath(); ctx.moveTo(...FT); ctx.lineTo(...RT); ctx.strokeStyle=hsla(0,0,100,0.15); ctx.lineWidth=1.5*z; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(...FT); ctx.lineTo(...LT); ctx.strokeStyle=hsla(0,0,100,0.08); ctx.lineWidth=1.5*z; ctx.stroke();
  }
  if(opts.base){
    const baseH=3*z;
    ctx.beginPath(); ctx.moveTo(F[0],F[1]); ctx.lineTo(R[0],R[1]); ctx.lineTo(R[0],R[1]-baseH); ctx.lineTo(F[0],F[1]-baseH); ctx.closePath();
    ctx.fillStyle=hsl(col.h,Math.max(0,col.s-20),col.l-25); ctx.fill();
    ctx.beginPath(); ctx.moveTo(F[0],F[1]); ctx.lineTo(L[0],L[1]); ctx.lineTo(L[0],L[1]-baseH); ctx.lineTo(F[0],F[1]-baseH); ctx.closePath();
    ctx.fillStyle=hsl(col.h,Math.max(0,col.s-20),col.l-30); ctx.fill();
  }
}
function drawRoof(cx, cy, h, z, roofH, roofCol){

  ctx.beginPath(); ctx.moveTo(...LT); ctx.lineTo(...BT); ctx.lineTo(...peak); ctx.closePath(); ctx.fillStyle=hsl(roofCol.h,roofCol.s,roofCol.l-18); ctx.fill();

function drawTree(cx, cy, z, seed){
  const s=z, th=(10+(seed%4)*3)*s, lr=(7+(seed%3)*2)*s, hueShift=(seed*17)%25;
  ctx.beginPath(); ctx.ellipse(cx+3*s,cy,lr*0.7,lr*0.25,0,0,Math.PI*2); ctx.fillStyle='rgba(0,0,0,0.08)'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx-1.8*s,cy); ctx.quadraticCurveTo(cx-1*s,cy-th*0.5,cx-0.8*s,cy-th); ctx.lineTo(cx+0.8*s,cy-th); ctx.quadraticCurveTo(cx+1*s,cy-th*0.5,cx+1.8*s,cy); ctx.closePath(); ctx.fillStyle=hsl(25,40,32); ctx.fill();
  const layers=[{dx:0,dy:-th-lr*0.3,r:lr*0.85,dl:0},{dx:-lr*0.35,dy:-th-lr*0.15,r:lr*0.7,dl:-5},{dx:lr*0.3,dy:-th-lr*0.1,r:lr*0.65,dl:-3},{dx:0,dy:-th-lr*0.6,r:lr*0.55,dl:6}];
  layers.forEach(l=>{ ctx.beginPath(); ctx.arc(cx+l.dx,cy+l.dy,l.r,0,Math.PI*2); ctx.fillStyle=hsl(118+hueShift,50,36+l.dl); ctx.fill(); });
  ctx.beginPath(); ctx.arc(cx-lr*0.15,cy-th-lr*0.5,lr*0.3,0,Math.PI*2); ctx.fillStyle=hsla(115+hueShift,55,50,0.25); ctx.fill();
}
function drawFlowers(cx, cy, z, seed){
  const s=z;
  for(let i=0;i<7;i++){
    const fx=cx+((i*13+seed*7)%21-10)*s, fy=cy+((i*7+seed*3)%11-5)*s*0.5, hue=(340+i*45+seed*30)%360;
    ctx.beginPath(); ctx.moveTo(fx,fy); ctx.lineTo(fx,fy-6*s); ctx.strokeStyle=hsl(120,45,35); ctx.lineWidth=1*s; ctx.stroke();

}
function drawSmoke(cx, cy, z){

function drawFire(cx, cy, z){
  for(let i=0;i<7;i++){
    const t=(S.time*2.2+i*0.5)%1.4, r=(4-t*2.4)*z*(1+i*0.04), a=Math.max(0,0.7-t*0.5);

function drawProtester(p, z){

    ctx.fillStyle='#fff'; ctx.fillRect(cx+2*z,cy-13*z+bob,7*z,5*z); ctx.fillStyle=hsl(0,70,45); ctx.fillRect(cx+3*z,cy-12*z+bob,5*z,1.2*z); ctx.fillRect(cx+3*z,cy-10*z+bob,4*z,1.2*z);

function drawUnit(u, z){

function drawMolotov(m, z){

    if(tile.t==='water' && S.sel!=='road') return;
    const def=B[S.sel]; if(def){ ctx.globalAlpha=0.45;
      if(S.sel==='road'){ const isB=tile.t==='water'; drawBlock(cx,cy,isB?6:1,{h:0,s:0,l:isB?40:35},z,{base:isB}); }
      else if((def.sz||1)>1){ drawBigBuilding(c,r,def.sz,def,null); }
      else drawBlock(cx,cy,def.h,def.c,z,{win:def.h>15});
      ctx.globalAlpha=1; }
  }
}

// ============================================================
// GAME LOGIC
// ============================================================
// is any tile adjacent to a sz×sz footprint at (c,r) water?
function nearWater(c,r,sz){
  for(let rr=r-1; rr<=r+sz; rr++) for(let cc=c-1; cc<=c+sz; cc++){
    if(cc<0||cc>=G||rr<0||rr>=G) continue;
    if(rr>=r&&rr<r+sz&&cc>=c&&cc<c+sz) continue;     // inside footprint, skip
    if(S.grid[rr][cc].t==='water') return true;
  }
  return false;
}
function recalc(){
  let p=0,baseH=50,prod=0,cons=0,inc=0,n=0,wprod=0;
  const counts={residential:0,commercial:0,industrial:0};
  for(let r=0;r<G;r++) for(let c=0;c<G;c++){
    const b=S.grid[r][c].b; if(b&&B[b]){ const d=B[b]; p+=d.pop||0; baseH+=d.hap||0;
      if(d.nrg>0) prod+=d.nrg; else cons+=-d.nrg;
      if(d.wtr){ wprod += nearWater(c,r,d.sz||1) ? d.wtr*1.5 : d.wtr; }  // +50% beside water
      inc+=d.inc||0; n++; if(counts[d.cat]!==undefined) counts[d.cat]++; }
  }
  S.res.popCap=p; S.res.baseHappy=baseH; S.bCount=n;
  // WATER: every citizen drinks 2/s. Net < 0 means a shortage → deaths (handled in loop).
  S.res.waterProd=wprod;
  S.res.water=Math.round(wprod - Math.round(S.res.pop)*2);
  S.dying = S.res.water < 0;
  // happiness = structural happiness + accumulated event modifier, clamped to ±1000
  S.res.happy = Math.max(-1000, Math.min(1000, Math.round(baseH + S.happyMod)));
  // unhappy cities (< -30) burn 30% MORE power per second
  let cons2 = cons; if(S.res.happy < -30) cons2 = cons*1.3;
  S.res.energy = Math.round(prod - cons2);
  S.crisis = S.res.energy <= -50;                 // total blackout
  S.powerRatio = cons2===0 ? 1 : Math.max(0, Math.min(1, prod/cons2)); // <0 power = slower everything
  // income: power availability × happiness multiplier, with penalties
  let happyMult = Math.max(0.2, Math.min(3, 1 + S.res.happy/200));
  let income = inc * S.powerRatio * happyMult;
  if(S.res.happy < -30) income *= 0.8;            // unrest tax: −20% income
  if(S.crisis) income = 0;                         // blackout: nothing earns
  S.res.income = Math.round(income);
  // demand bars
  const housing=counts.residential, jobs=counts.commercial+counts.industrial;
  S.demand.r=Math.max(0.05,Math.min(1,(jobs+1)/(housing+1)*0.6));
  S.demand.c=Math.max(0.05,Math.min(1,(p/120+1)/(counts.commercial+1)*0.5));
  S.demand.i=Math.max(0.05,Math.min(1,(counts.commercial+1)/(counts.industrial+1)*0.5));
  S.mmDirty=true;
}
function occupyFootprint(c,r,sz){ for(let rr=r;rr<r+sz;rr++)for(let cc=c;cc<c+sz;cc++){ if(cc===c&&rr===r)continue; if(S.grid[rr]&&S.grid[rr][cc]) S.grid[rr][cc].occ={ac:c,ar:r}; } }
function clearFootprint(c,r,sz){ for(let rr=r;rr<r+sz;rr++)for(let cc=c;cc<c+sz;cc++){ if(S.grid[rr]&&S.grid[rr][cc]) S.grid[rr][cc].occ=undefined; } }
function place(c,r,type,isDrag){
  if(c<0||c>=G||r<0||r>=G) return false;
  const d=B[type]; if(!d) return false;
  const sz=d.sz||1;
  // validate the whole sz×sz footprint
  for(let rr=r;rr<r+sz;rr++) for(let cc=c;cc<c+sz;cc++){
    if(cc<0||cc>=G||rr<0||rr>=G){ if(!isDrag){ notify('Footprint runs off the map!','error'); snd('error'); } return false; }
    if(isLocked(cc,rr)){ if(!isDrag){ notify('Tile locked! Expand map to unlock.','error'); snd('error'); } return false; }
    const t=S.grid[rr][cc];
    if(t.t==='water' && type!=='road'){ if(!isDrag){ notify("Can't build on water!",'error'); snd('error'); } return false; }
    if(t.b || t.occ){ if(!isDrag){ notify(sz>1?'Need 2×2 clear space!':'Tile occupied!','error'); snd('error'); } return false; }
  }
  if(!S.sandbox && S.res.money<d.$){ if(!isDrag){ notify('Not enough funds!','error'); snd('error'); } return false; }
  S.undoStack.push({a:'place',c,r,type});
  const tile=S.grid[r][c]; tile.b=type; tile.anim=1; tile.sz=sz>1?sz:undefined;
  if(sz>1) occupyFootprint(c,r,sz);
  if(!S.sandbox) S.res.money-=d.$;
  recalc(); snd('place'); spawn(c,r,'56,189,248'); if(!isDrag) notify(`Placed ${d.n}${S.sandbox?'':` (-$${d.$})`}`,'success'); emit();
  return true;
}
function remove(c,r,isDrag){
  if(c<0||c>=G||r<0||r>=G) return false;
  let tile=S.grid[r][c];
  if(tile.occ){ const a=tile.occ; c=a.ac; r=a.ar; tile=S.grid[r][c]; }   // reserved tile → operate on anchor
  if(!tile.b){ if(!isDrag){ notify('Nothing here!','error'); snd('error'); } return false; }
  const type=tile.b, d=B[type], sz=(d&&d.sz)||1; const ref=Math.floor((d?d.$:0)*0.5);
  S.undoStack.push({a:'remove',c,r,type});
  tile.b=null; tile.sz=undefined; tile.burning=0;
  if(sz>1) clearFootprint(c,r,sz);
  if(!S.sandbox) S.res.money+=ref;
  recalc(); snd('remove'); spawn(c,r,'248,113,113');
  if(!isDrag){ if(ref>0&&!S.sandbox) notify(`Removed (+$${ref} refund)`,'info'); else notify('Removed','info'); }
  emit(); return true;
}
function undo(){
  if(!S.undoStack.length){ notify('Nothing to undo','info'); emit(); return; }
  const act=S.undoStack.pop(); const d=B[act.type], sz=(d&&d.sz)||1, tile=S.grid[act.r][act.c];
  if(act.a==='place'){ tile.b=null; tile.sz=undefined; if(sz>1) clearFootprint(act.c,act.r,sz); if(!S.sandbox) S.res.money+=d.$; recalc(); snd('remove'); notify('Undone','info'); }
  else if(act.a==='remove'){ tile.b=act.type; tile.sz=sz>1?sz:undefined; if(sz>1) occupyFootprint(act.c,act.r,sz); if(!S.sandbox) S.res.money-=Math.floor(d.$*0.5); recalc(); snd('place'); notify('Undone','info'); }
  emit();
}
function spawn(c,r,col){
  const pos=g2s(c,r);
  for(let i=0;i<14;i++) S.particles.push({ x:pos.x, y:pos.y, vx:(Math.random()-.5)*5, vy:-Math.random()*3.5-1, r:2+Math.random()*3, a:0.8, col, life:1 });
}
function upgradeMap(){
  if(S.expansions>=100){ notify('Max expansions reached!','info'); emit(); return; }
  const cost=2000+S.expansions*500;
  if(!S.sandbox && S.res.money<cost){ notify(`Need $${cost} to expand!`,'error'); snd('error'); emit(); return; }
  if(!S.sandbox) S.res.money-=cost;
  S.expansions++; S.mmDirty=true; notify('Map Expanded! (+50 tiles)','success'); snd('upgrade'); emit();
}
function checkAchievements(){
  ACHIEVEMENTS.forEach(a=>{
    if(!S.achieved[a.id] && a.test(S)){
      S.achieved[a.id]=true;
      const item={ id:a.id+'_'+(toastSeq++), ic:a.ic, label:a.label };
      achievementsShown.push(item); snd('achieve');
      notify(`🏆 Achievement: ${a.label}`,'gold');
      setTimeout(()=>{ achievementsShown=achievementsShown.filter(x=>x.id!==item.id); emit(); }, 5000);
    }
  });

// ============================================================
// CIVIL UNREST — protests, fires, police & soldiers
// ============================================================
function spawnAt(gc,gr,col){
  const pos=g2s(gc,gr);
  for(let i=0;i<12;i++) S.particles.push({ x:pos.x, y:pos.y, vx:(Math.random()-.5)*5, vy:-Math.random()*3.5-1, r:2+Math.random()*3, a:0.8, col, life:1 });
}
function allBuildings(){
  const out=[]; for(let r=0;r<G;r++) for(let c=0;c<G;c++) if(S.grid[r][c].b && !isLocked(c,r)) out.push({c,r,b:S.grid[r][c].b}); return out;
}
function startProtest(){
  const builds=allBuildings(); if(builds.length<2) return;
  const wave=2+Math.floor(Math.random()*6);     // 2–7 protesters per wave
  for(let i=0;i<wave;i++){
    // spawn at a random unlocked edge-ish tile
    let sc,sr,tries=0;
    do{ const t=unlockSeq[Math.floor(Math.random()*getUnlockedCount())]; sc=t.c; sr=t.r; tries++; }
    while(S.grid[sr][sc].t==='water' && tries<10);
    // target a building — protesters love torching civic & schools
    const targets=builds.filter(b=>['school','university','library','cityhall','courthouse','museum'].includes(b.b));
    const tgt=(targets.length&&Math.random()<0.6)?targets[Math.floor(Math.random()*targets.length)]:builds[Math.floor(Math.random()*builds.length)];
    S.protesters.push({ c:sc,r:sr,px:sc,py:sr,tc:tgt.c,tr:tgt.r, speed:0.8+Math.random()*0.7,
      col:`hsl(${Math.random()<0.5?0:25},${70+Math.random()*20|0}%,${45+Math.random()*10|0}%)`, sign:Math.random()<0.5, anger:0 });
  }
  S.protestActive=true;
  notify(`🪧 PROTEST! ${wave} angry citizens are marching!`,'error'); snd('error');
}
function updateProtests(gdt){
  if(!S.protesters.length){ if(S.protestActive){ S.protestActive=false; } return; }
  S.protestActive=true;
  let burnedThisFrame=false;
  S.protesters.forEach(p=>{
    const tile=(p.tc>=0&&p.tr>=0&&S.grid[p.tr]&&S.grid[p.tr][p.tc])?S.grid[p.tr][p.tc]:null;
    if(!tile || !tile.b){ // target gone — pick a new one
      const builds=allBuildings(); if(builds.length){ const t=builds[Math.floor(Math.random()*builds.length)]; p.tc=t.c; p.tr=t.r; } return;
    }
    const dx=p.tc-p.px, dy=p.tr-p.py, dist=Math.hypot(dx,dy);
    if(p.throwT>0) p.throwT-=gdt;
    if(dist<0.6){ // arrived — set the building ablaze
      tile.burning=(tile.burning||0)+gdt;
      p.anger=Math.min(1,p.anger+gdt);
      if(tile.burning>5){ // building destroyed
        const d=B[tile.b]; const sz=(d&&d.sz)||1; tile.b=null; tile.sz=undefined; tile.burning=0; if(sz>1) clearFootprint(p.tc,p.tr,sz); burnedThisFrame=true;
        spawnAt(p.tc,p.tr,'120,40,30'); S.happyMod-=8;
        notify(`🔥 ${d?d.n:'A building'} was burned down!`,'error');
        const builds=allBuildings(); if(builds.length){ const t=builds[Math.floor(Math.random()*builds.length)]; p.tc=t.c; p.tr=t.r; }
      }
    } else {
      // from a few tiles out, hurl a molotov to ignite the target
      if(dist<5 && dist>1.2 && !(p.throwT>0)){ S.molotovs.push({ sc:p.px, sr:p.py, tc:p.tc, tr:p.tr, t:0, dur:0.55+Math.random()*0.25 }); p.throwT=2.5+Math.random()*2; p.anger=Math.min(1,p.anger+0.3); }
      const step=Math.min(dist,p.speed*gdt); p.px+=(dx/dist)*step; p.py+=(dy/dist)*step;
    }
  });
  if(burnedThisFrame) recalc();
}
const UNIT_LIFE=120; // 2 minutes
// Summon a police/soldier UNIT anywhere — it lives for 2 min, hunts protesters, then despawns.
function deployForce(c,r,kind,isDrag){
  if(c<0||c>=G||r<0||r>=G) return false;
  if(S.units.length>=30){ if(!isDrag){ notify('Too many units deployed!','info'); snd('error'); } return false; }
  const cost = kind==='soldier'?4000:150;
  if(!S.sandbox && S.res.money<cost){ if(!isDrag){ notify(`Not enough funds (need $${cost})!`,'error'); snd('error'); } return false; }
  if(!S.sandbox) S.res.money-=cost;
  S.units.push({ kind, c, r, px:c, py:r, speed:kind==='soldier'?1.7:2.2, life:UNIT_LIFE, maxLife:UNIT_LIFE, cool:0 });
  spawnAt(c,r, kind==='soldier'?'120,140,60':'80,120,220'); snd(kind==='soldier'?'upgrade':'select');
  if(!isDrag) notify(kind==='soldier'?'🪖 Soldier deployed (2:00) — clears crowds, but kills gut happiness':'🚓 Riot Police deployed (2:00) — arrests protesters one-by-one','info');
  emit(); return true;
}
function updateUnits(gdt){
  if(!S.units.length) return;
  let changed=false;
  S.units.forEach(u=>{
    u.life-=gdt; if(u.cool>0) u.cool-=gdt;
    let best=null,bd=1e9;
    S.protesters.forEach(p=>{ const d=Math.hypot(p.px-u.px,p.py-u.py); if(d<bd){ bd=d; best=p; } });
    if(best){
      if(bd>0.8){ const dx=best.px-u.px, dy=best.py-u.py, dist=Math.hypot(dx,dy)||1, step=Math.min(dist,u.speed*gdt); u.px+=dx/dist*step; u.py+=dy/dist*step; }
      else if(u.cool<=0){
        if(u.kind==='soldier'){
          const inR=S.protesters.filter(p=>Math.hypot(p.px-u.px,p.py-u.py)<=2.2);
          let killed=0; inR.forEach(t=>{ S.protesters=S.protesters.filter(p=>p!==t); spawnAt(Math.round(t.px),Math.round(t.py),'180,30,30'); killed++; });
          if(killed){ let h=S.res.happy; for(let k=0;k<killed;k++) h=h>0?h*0.5:h-50; S.happyMod=Math.round(h)-S.res.baseHappy; changed=true; snd('error'); }
          u.cool=2.5;
        } else {
          S.protesters=S.protesters.filter(p=>p!==best); spawnAt(Math.round(best.px),Math.round(best.py),'56,120,248'); S.happyMod-=1; changed=true; snd('remove'); u.cool=1.0;
        }
      }
    } else { // no targets — drift back toward where it was summoned
      const dx=u.c-u.px, dy=u.r-u.py, dist=Math.hypot(dx,dy); if(dist>0.4){ const step=Math.min(dist,u.speed*0.5*gdt); u.px+=dx/dist*step; u.py+=dy/dist*step; }
    }
  });
  const before=S.units.length;
  S.units=S.units.filter(u=>{ if(u.life<=0){ spawnAt(Math.round(u.px),Math.round(u.py),'150,150,150'); if(S.hoverUnit===u) S.hoverUnit=null; return false; } return true; });
  if(changed || S.units.length!==before) recalc();
}

// ============================================================
// SAVE / LOAD
// ============================================================
function serialize(){
  const grid=S.grid.map(row=>row.map(t=>{ const cell={ b:t.b, t:t.t }; if(t.sz) cell.sz=t.sz; if(t.occ) cell.occ=t.occ; return cell; }));
  return JSON.stringify({ version:7, name:'SkyGrid Save', date:new Date().toISOString(), sandbox:S.sandbox, money:S.res.money, expansions:S.expansions, happyMod:S.happyMod, achieved:S.achieved, grid }, null, 2);
}
// Best-effort recovery from a mangled/truncated save: salvage whatever still parses.
function attemptRecover(json){
  // 1) trailing garbage — cut to the last closing brace and retry
  const lastBrace=json.lastIndexOf('}');
  if(lastBrace>0){ try{ return JSON.parse(json.slice(0,lastBrace+1)); }catch(_){} }
  // 2) truncated mid-file — try re-closing the JSON
  for(const tail of ['"}]}','}]}',']}','"}}','}}','}']){ try{ return JSON.parse(json+tail); }catch(_){} }
  // 3) total wreck — scrape any building types out of the text and scatter them onto a fresh map
  const types=[...json.matchAll(/"b"\s*:\s*"([a-zA-Z]+)"/g)].map(m=>m[1]).filter(t=>B[t]);
  if(types.length){
    const grid=[]; for(let r=0;r<G;r++){ grid[r]=[]; for(let c=0;c<G;c++) grid[r][c]={b:null,t:'grass'}; }
    let i=0; for(const t of unlockSeq){ if(i>=types.length) break; if(grid[t.r][t.c]) { grid[t.r][t.c].b=types[i++]; } }
    return { version:6, recovered:true, money:1000, expansions:0, grid };
  }
  return null;
}
function deserialize(json){
  let data, recovered=false;
  try{ data=JSON.parse(json); }
  catch(e){ data=attemptRecover(json); recovered=true; if(!data){ notify('Save is corrupted and unrecoverable.','error'); snd('error'); emit(); return false; } }
  try{
    if(!data.grid||!Array.isArray(data.grid)){ data=attemptRecover(json)||data; recovered=true; if(!data.grid) throw new Error('no grid'); }
    initGrid();
    S.happyMod=0; S.protesters=[]; S.protestActive=false; S.crisis=false; S.units=[]; S.molotovs=[]; S.hoverUnit=null;
    if(data.version===2){
      const oldG=24, offset=Math.floor((G-oldG)/2);
      for(let r=0;r<oldG;r++) for(let c=0;c<oldG;c++) if(data.grid[r]&&data.grid[r][c]!==undefined) S.grid[r+offset][c+offset].b=data.grid[r][c];
      S.expansions=0;
    } else {
      for(let r=0;r<G;r++) for(let c=0;c<G;c++){
        if(data.grid[r]&&data.grid[r][c]!==undefined){
          if(typeof data.grid[r][c]==='string'||data.grid[r][c]===null) S.grid[r][c].b=data.grid[r][c];
          else { const cell=data.grid[r][c]; S.grid[r][c].b=cell.b; if(cell.t) S.grid[r][c].t=cell.t; if(cell.sz) S.grid[r][c].sz=cell.sz; if(cell.occ) S.grid[r][c].occ=cell.occ; }
        }
      }
      S.expansions=data.expansions||0;
    }
    if(typeof data.money==='number') S.res.money=data.money;
    if(typeof data.sandbox==='boolean'){ S.sandbox=data.sandbox; applySandboxUI(); }
    if(typeof data.happyMod==='number') S.happyMod=data.happyMod;
    if(data.achieved) S.achieved=data.achieved;
    S.res.pop=0; recalc();
    if(recovered||data.recovered){ let saved=0; for(let r=0;r<G;r++) for(let c=0;c<G;c++) if(S.grid[r][c].b) saved++; notify(`⚠ Save was corrupted — recovered ${saved} building${saved===1?'':'s'}`,'info'); }
    else notify('City loaded!','success');
    snd('save'); emit(); return true;
  } catch(e){ notify('Failed to load: '+e.message,'error'); snd('error'); emit(); return false; }
}
function saveToBrowser(){ try{ localStorage.setItem('skygrid_save',serialize()); notify('Saved to browser!','success'); snd('save'); }catch(e){ notify('Save failed','error'); } }
function loadFromBrowser(){ const data=localStorage.getItem('skygrid_save'); if(!data){ notify('No save found','error'); snd('error'); return; } deserialize(data); }
function exportToFile(){
  const blob=new Blob([serialize()],{type:'application/json'}), url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=`skygrid-city-${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  notify('City exported!','success'); snd('save');
}
function clearCity(){ if(!confirm('Start a new city? This cannot be undone.')) return; initGrid(); S.res.money=5000; S.res.pop=0; S.undoStack=[]; S.expansions=0; S.people=[]; S.protesters=[]; S.protestActive=false; S.crisis=false; S.happyMod=0; S.units=[]; S.molotovs=[]; S.hoverUnit=null; recalc(); notify('New city started','info'); snd('save'); emit(); }
function applySandboxUI(){ document.getElementById('sandboxBorder').classList.toggle('active',S.sandbox); }
function toggleSandbox(){ S.sandbox=!S.sandbox; if(S.sandbox){ notify('♾️ Sandbox Mode ON — Infinite money!','info'); snd('coin'); } else { notify('Sandbox Mode OFF','info'); snd('select'); } applySandboxUI(); recalc(); emit(); }

let nTimeout=null;
function notify(msg,type){

}

function bindInput(){
  const applyTool=(c,r,isDrag)=>{
    if(S.sel==='bulldoze') remove(c,r,isDrag);
    else if(S.sel==='cop'||S.sel==='soldier'){ if(!isDrag) deployForce(c,r,S.sel,false); }  // click-only, no drag-spam
    else if(S.sel) place(c,r,S.sel,isDrag);
  };
  canvas.addEventListener('mousemove',e=>{
    if(S.isPanning){ S.camera.x=S.camS.x+(e.clientX-S.panS.x); S.camera.y=S.camS.y+(e.clientY-S.panS.y); return; }
    const g=s2g(e.clientX,e.clientY);
    if(g.c>=0&&g.c<G&&g.r>=0&&g.r<G){
      if(S.isBuilding && (!S.hover||S.hover.c!==g.c||S.hover.r!==g.r)) applyTool(g.c,g.r,true);
      S.hover=g; canvas.style.cursor=S.sel?'pointer':'default';
      // building hover tooltip (only when no tool selected) — resolves 2×2 reserved cells to their anchor
      let bc=g.c, br=g.r; const cell=S.grid[g.r][g.c]; if(cell.occ){ bc=cell.occ.ac; br=cell.occ.ar; }
      const anchorCell=S.grid[br][bc];
      const hb=(!S.sel && anchorCell.b)?(br*G+bc):-1;
      if(hb!==S.lastHoverKey){ S.lastHoverKey=hb;
        if(hb>=0){ const sp=g2s(bc,br); S.hoverB={ def:B[anchorCell.b], x:sp.x, y:sp.y }; } else S.hoverB=null;
        emit();
      }
      // unit hover (remaining lifetime) — only when no tool selected
      let hu=null; if(!S.sel){ let bd=0.9; S.units.forEach(u=>{ const d=Math.hypot(u.px-g.c,u.py-g.r); if(d<bd){ bd=d; hu=u; } }); }
      if(hu!==S.hoverUnit){ S.hoverUnit=hu; emit(); }
    } else { S.hover=null; canvas.style.cursor='default'; if(S.lastHoverKey!==-1||S.hoverUnit){ S.lastHoverKey=-1; S.hoverB=null; S.hoverUnit=null; emit(); } }
  });
  canvas.addEventListener('mousedown',e=>{
    initA();
    if(e.button===2||e.button===1){ S.isPanning=true; S.panS={x:e.clientX,y:e.clientY}; S.camS={x:S.camera.x,y:S.camera.y}; canvas.style.cursor='grabbing'; e.preventDefault(); return; }
    if(e.button===0&&S.hover){ S.isBuilding=true; const {c,r}=S.hover; applyTool(c,r,false); }
  });
  canvas.addEventListener('mouseup',e=>{ if(e.button===2||e.button===1){ S.isPanning=false; canvas.style.cursor='default'; } if(e.button===0) S.isBuilding=false; });
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
  canvas.addEventListener('wheel',e=>{ const old=S.camera.zoom; S.camera.zoom=e.deltaY<0?Math.min(3,S.camera.zoom*1.1):Math.max(0.3,S.camera.zoom/1.1); const ratio=S.camera.zoom/old; S.camera.x*=ratio; S.camera.y*=ratio; emit(); e.preventDefault(); },{passive:false});

  // ===== TOUCH (mobile) =====
  // 1 finger: tap = use tool / drag = paint (when a build/bulldoze tool is held) or pan (when none).
  // 2 fingers: pinch to zoom + drag to pan.
  const isToolHeld=()=> S.sel==='bulldoze' || S.sel==='cop' || S.sel==='soldier' || (S.sel && !!B[S.sel]);
  const touchDist=t=>{ const dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.hypot(dx,dy); };
  const touchMid=t=>({ x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2 });
  let tMode=null, tStart=null, tMoved=false, pinchDist=0, pinchMid=null;
  canvas.addEventListener('touchstart',e=>{
    initA();
    if(e.touches.length===1){
      const t=e.touches[0]; tStart={x:t.clientX,y:t.clientY}; tMoved=false;
      const g=s2g(t.clientX,t.clientY);
      S.hover=(g.c>=0&&g.c<G&&g.r>=0&&g.r<G)?g:null;
      if(isToolHeld()){ tMode='paint'; S.isBuilding=true; if(S.hover) applyTool(g.c,g.r,false); }
      else { tMode='pan'; S.isPanning=true; S.panS={x:t.clientX,y:t.clientY}; S.camS={x:S.camera.x,y:S.camera.y}; }
    } else if(e.touches.length===2){
      tMode='pinch'; S.isPanning=false; S.isBuilding=false; S.hover=null;
      pinchDist=touchDist(e.touches); pinchMid=touchMid(e.touches);
    }
    emit(); e.preventDefault();
  },{passive:false});
  canvas.addEventListener('touchmove',e=>{
    if(tMode==='pinch' && e.touches.length>=2){
      const d=touchDist(e.touches), m=touchMid(e.touches);
      if(pinchDist>0){ const old=S.camera.zoom; S.camera.zoom=Math.max(0.3,Math.min(3,S.camera.zoom*d/pinchDist)); const ratio=S.camera.zoom/old; S.camera.x*=ratio; S.camera.y*=ratio; }
      if(pinchMid){ S.camera.x+=m.x-pinchMid.x; S.camera.y+=m.y-pinchMid.y; }
      pinchDist=d; pinchMid=m; emit();
    } else if(tMode==='pan' && e.touches.length===1){
      const t=e.touches[0]; S.camera.x=S.camS.x+(t.clientX-S.panS.x); S.camera.y=S.camS.y+(t.clientY-S.panS.y);
      if(Math.hypot(t.clientX-tStart.x,t.clientY-tStart.y)>6) tMoved=true; emit();
    } else if(tMode==='paint' && e.touches.length===1){
      const t=e.touches[0]; if(Math.hypot(t.clientX-tStart.x,t.clientY-tStart.y)>6) tMoved=true;
      const g=s2g(t.clientX,t.clientY);
      if(g.c>=0&&g.c<G&&g.r>=0&&g.r<G){
        if(!S.hover||S.hover.c!==g.c||S.hover.r!==g.r){ S.hover=g; applyTool(g.c,g.r,true); }
      }
    }
    e.preventDefault();
  },{passive:false});
  const endTouch=e=>{
    if(e.touches.length===0){ S.isPanning=false; S.isBuilding=false; S.hover=null; tMode=null; pinchMid=null; pinchDist=0; emit(); }
    else if(e.touches.length===1 && tMode==='pinch'){
      // second finger lifted — fall back to a one-finger pan from here
      const t=e.touches[0]; tMode='pan'; S.isPanning=true; S.panS={x:t.clientX,y:t.clientY}; S.camS={x:S.camera.x,y:S.camera.y}; tStart={x:t.clientX,y:t.clientY}; pinchMid=null; pinchDist=0;
    }
    e.preventDefault();
  };
  canvas.addEventListener('touchend',endTouch,{passive:false});
  canvas.addEventListener('touchcancel',endTouch,{passive:false});
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT') return;
    S.keys[e.key.toLowerCase()]=true;
    if(e.key==='Escape'){ S.sel=null; emit(); }
    if(e.key==='h'||e.key==='H') window.__toggleHelp&&window.__toggleHelp();
    if(e.ctrlKey&&e.key==='z'){ undo(); e.preventDefault(); }
    if(e.key==='g'){ S.showGrid=!S.showGrid; emit(); }
    if(e.key===' '){ S.speed=S.speed===0?1:0; emit(); e.preventDefault(); }
  });
  document.addEventListener('keyup',e=>{ S.keys[e.key.toLowerCase()]=false; });
}

// GAME LOOP
// ============================================================
let lt=0;
function loop(ts){
  const dt=Math.min(0.05,(ts-lt)/1000); lt=ts; const gdt=dt*S.speed; S.time+=gdt;
  const cs=300*dt;
  if(S.keys['w']||S.keys['arrowup']) S.camera.y+=cs;
  if(S.keys['s']||S.keys['arrowdown']) S.camera.y-=cs;
  if(S.keys['a']||S.keys['arrowleft']) S.camera.x+=cs;
  if(S.keys['d']||S.keys['arrowright']) S.camera.x-=cs;

  // auto day/night
  if(S.autoCycle){ const phase=Math.sin(S.time*0.05); const night=phase<-0.2; if(night!==S.isNight){ S.isNight=night; emit(); } }

  // blackout (energy ≤ −50): happiness bleeds −7 every 2s until power is restored
  if(S.crisis){ S.crisisTimer+=gdt; if(S.crisisTimer>=2){ S.crisisTimer=0; S.happyMod-=7; recalc(); } } else S.crisisTimer=0;

  // protest waves — chance rises sharply as the city turns unhappy
  S.protestTimer+=gdt;
  if(S.protestTimer>=12){ S.protestTimer=0;
    // ≥700 happiness = a content city = ZERO protests
    const chance = S.res.happy>=700 ? 0 : S.res.happy<-100?0.9 : S.res.happy<0?0.6 : S.res.happy<40?0.2 : S.res.happy<200?0.05 : 0.015;
    if(S.bCount>3 && S.protesters.length<40 && Math.random()<chance) startProtest();
  }
  updateProtests(gdt);
  updateUnits(gdt);
  if(S.molotovs.length){
    S.molotovs.forEach(m=>{ m.t+=gdt; });
    S.molotovs=S.molotovs.filter(m=>{
      if(m.t>=m.dur){ let tr=Math.round(m.tr), tc=Math.round(m.tc); let tl=S.grid[tr]&&S.grid[tr][tc];
        if(tl){ if(tl.occ){ tc=tl.occ.ac; tr=tl.occ.ar; tl=S.grid[tr][tc]; } if(tl&&tl.b) tl.burning=(tl.burning||0)+1.8; }
        spawnAt(tc,tr,'230,120,30'); return false; }
      return true;
    });
  }

  S.incTimer+=gdt;
  if(S.incTimer>=1){
    S.incTimer=0;
    // active protests bleed happiness; a calm city slowly recovers toward its structural level
    if(S.protesters.length) S.happyMod -= S.protesters.length*0.6;
    else if(!S.crisis && Math.abs(S.happyMod)>0.5) S.happyMod += (0-S.happyMod)*0.03;
    recalc();
    // ease population toward capacity (stalls during blackout or water shortage)
    const target=(S.crisis||S.dying)?0:S.res.popCap; S.res.pop += (target-S.res.pop)*0.15; if(Math.abs(target-S.res.pop)<1) S.res.pop=target;
    // WATER SHORTAGE: citizens die — 10/s, or 100/s once the deficit hits −50
    if(S.res.water<0 && S.res.pop>0){
      const rate=S.res.water<=-50?100:10;
      S.res.pop=Math.max(0,S.res.pop-rate);
      S.happyMod-=rate*0.08;                 // mass casualties enrage the city → feeds protests
      S.deathTimer++;
      if(S.deathTimer>=2){ S.deathTimer=0;
        notify(`💧 WATER SHORTAGE — ~${rate} citizens dying/sec! Build pumps!`,'error'); snd('error');
        const homes=[]; for(let r=0;r<G;r++)for(let c=0;c<G;c++){ const b=S.grid[r][c].b; if(b&&B[b].cat==='residential'&&!isLocked(c,r)) homes.push({c,r}); }
        if(homes.length){ const h=homes[Math.floor(Math.random()*homes.length)]; spawnAt(h.c,h.r,'190,30,30'); }
      }
      recalc();
    } else S.deathTimer=0;
    if(!S.sandbox){ S.res.money+=S.res.income; if(S.res.money<0) S.res.money=0; }
    const bo=document.getElementById('brownout'); if(bo){ bo.classList.toggle('active', S.powerRatio<1||S.crisis); bo.classList.toggle('crisis', S.crisis); }
    checkAchievements();
    emit();
  }

  if(S.bCount>0 && S.speed>0 && Math.random()<0.1 && S.people.length<S.res.popCap*1.5 && S.people.length<(IS_TOUCH?150:300)){
    const res=[];
    for(let r=0;r<G;r++) for(let c=0;c<G;c++) if(S.grid[r][c].b && B[S.grid[r][c].b].cat==='residential' && !isLocked(c,r)) res.push({c,r});
    if(res.length){
      const start=res[Math.floor(Math.random()*res.length)]; let rd=null; const dirs=[[0,1],[1,0],[0,-1],[-1,0]];
      for(let d of dirs){ const nc=start.c+d[0], nr=start.r+d[1]; if(nc>=0&&nc<G&&nr>=0&&nr<G && S.grid[nr][nc].b==='road' && !isLocked(nc,nr)){ rd={c:nc,r:nr}; break; } }
      if(rd) S.people.push({ c:rd.c,r:rd.r,tc:rd.c,tr:rd.r,px:rd.c,py:rd.r,lc:undefined,lr:undefined, speed:1.5+Math.random(), col:hsl(Math.random()*360,70,60), life:30+Math.random()*30 });
    }
  }
  S.people.forEach(p=>{
    p.life-=gdt; const dx=p.tc-p.px, dy=p.tr-p.py, dist=Math.hypot(dx,dy);
    if(dist<0.05){
      p.c=p.tc; p.r=p.tr; p.px=p.c; p.py=p.r; const dirs=[[0,1],[1,0],[0,-1],[-1,0]], valid=[];
      dirs.forEach(d=>{ const nc=p.c+d[0], nr=p.r+d[1]; if(nc>=0&&nc<G&&nr>=0&&nr<G && S.grid[nr][nc].b==='road' && !isLocked(nc,nr)){ if(nc!==p.lc||nr!==p.lr) valid.push({c:nc,r:nr}); } });
      if(valid.length>0){ const next=valid[Math.floor(Math.random()*valid.length)]; p.lc=p.c; p.lr=p.r; p.tc=next.c; p.tr=next.r; }
      else { p.tc=p.lc!==undefined?p.lc:p.c; p.tr=p.lr!==undefined?p.lr:p.r; p.lc=p.c; p.lr=p.r; }
    } else { const step=Math.min(dist,p.speed*gdt); p.px+=(dx/dist)*step; p.py+=(dy/dist)*step; }
  });
  S.people=S.people.filter(p=>p.life>0);
  S.particles=S.particles.filter(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.a-=0.025; p.life-=dt; return p.a>0&&p.life>0; });
  S.clouds.forEach(cl=>{ cl.x+=cl.sp*S.speed; if(cl.x>VW+cl.w) cl.x=-cl.w*2; });
  for(let r=0;r<G;r++) for(let c=0;c<G;c++){ const t=S.grid[r][c];
    if(t.anim>0){ t.anim-=dt*2; if(t.anim<0) t.anim=0; }
    if(t.burning>0){ t.burning-=dt*0.5; if(t.burning<0) t.burning=0; } }
  render(); renderMinimap(); requestAnimationFrame(loop);
}

      <button className={"ctrl-btn"+(g.showGrid?' active':'')} title="Toggle Grid (G)" onClick={()=>{S.showGrid=!S.showGrid;emit();}}>▦</button>
      <button className={"ctrl-btn"+(g.isNight?' active':'')} title="Day / Night" onClick={()=>{S.isNight=!S.isNight;emit();}}>{g.isNight?'☀️':'🌙'}</button>
      <button className={"ctrl-btn"+(g.autoCycle?' active':'')} title="Auto Day/Night Cycle" onClick={()=>{S.autoCycle=!S.autoCycle;notify(S.autoCycle?'Auto cycle ON':'Auto cycle OFF','info');emit();}}>🔄</button>
      <button className={"ctrl-btn"+(!g.soundOn?'':' active')} title="Toggle Sound" onClick={()=>{initA();S.soundOn=!S.soundOn;emit();}}>{g.soundOn?'🔊':'🔇'}</button>
      <button className="ctrl-btn" title="Help (H)" onClick={onHelp}>?</button>
    </div>
  );
}

function SpeedBar({g}){
  const speeds=[[0,'❚❚'],[1,'1×'],[2,'2×'],[3,'3×']];
  return (
    <div className="speedBar">
      {speeds.map(([v,l])=>(
        <button key={v} className={"speed-btn"+(g.speed===v?' active':'')} title={v===0?'Pause (Space)':`${v}× speed`} onClick={()=>{S.speed=v;emit();}}>{l}</button>
      ))}
    </div>
  );
}

function SaveMenu({onClose}){
  return (
    <div className="saveMenu pointer" onClick={e=>e.stopPropagation()}>
      <button className="save-btn" onClick={()=>{saveToBrowser();onClose();}}><span className="sb-icon">💾</span>Save to Browser</button>
      <button className="save-btn" onClick={()=>{loadFromBrowser();onClose();}}><span className="sb-icon">📂</span>Load from Browser</button>
      <div className="save-divider"></div>
      <button className="save-btn" onClick={()=>{exportToFile();onClose();}}><span className="sb-icon">📤</span>Export to File</button>
      <button className="save-btn" onClick={()=>{document.getElementById('fileInput').click();onClose();}}><span className="sb-icon">📥</span>Import from File</button>
      <div className="save-divider"></div>
      <button className="save-btn" style={{color:'var(--err)'}} onClick={()=>{clearCity();onClose();}}><span className="sb-icon">🗑️</span>New City</button>
    </div>
  );
}

function Tooltip({def,pos}){
  if(!def) return null;
  const stats=[];
  if(def.pop) stats.push(`👥 ${def.pop>0?'+':''}${def.pop}`);
  if(def.hap) stats.push(`😊 ${def.hap>0?'+':''}${def.hap}`);
  if(def.nrg) stats.push(`⚡ ${def.nrg>0?'+':''}${def.nrg}`);
  if(def.wtr) stats.push(`💧 +${def.wtr}/s`);
  if(def.inc) stats.push(`💰 ${def.inc>0?'+':''}${def.inc}/s`);
  return (
    <div className="tooltip" style={{left:pos.x+12, top:pos.y-70}}>
      <div className="tt-name">{def.n}</div>
      <div className="tt-desc">{def.d}</div>
      <div className="tt-stats">{stats.map((s,i)=><span className="tt-stat" key={i}>{s}</span>)}</div>
    </div>
  );
}

function Palette({g}){
  const [cat,setCat]=useState('residential');
  const [q,setQ]=useState('');
  const [tt,setTt]=useState(null);
  let entries;
  if(q.trim()){ entries=Object.entries(B).filter(([_,b])=>b.n.toLowerCase().includes(q.toLowerCase())); }
  else if(cat==='tools'){ entries=Object.entries(TOOLS); }
  else { entries=Object.entries(B).filter(([_,b])=>b.cat===cat); }
  return (
    <div className="bottomPanel">
      <div className="paletteTop">
        <div className="categoryTabs">
          {CATS.map(([id,ic])=>(
            <button key={id} className={"cat-tab"+(cat===id&&!q?' active':'')} onClick={()=>{setCat(id);setQ('');S.sel=null;emit();snd('select');}}>{ic} {id[0].toUpperCase()+id.slice(1)}</button>
          ))}
        </div>
        <input className="searchBox pointer" placeholder="🔍 Search…" value={q} onChange={e=>setQ(e.target.value)} />
      </div>
      <div className="buildingCards">
        {entries.map(([key,def])=>{
          const cost=def.$||0;
          const disabled=cost>0 && !g.sandbox && g.money<cost;
          const costTxt=cost===0?'Free':(g.sandbox?'Free':`$${cost.toLocaleString()}`);
          return (
            <div key={key}
              className={"building-card"+(g.sel===key?' selected':'')+(disabled?' disabled':'')}
              onMouseEnter={e=>setTt({def, pos:{x:e.clientX,y:e.clientY}})}
              onMouseMove={e=>setTt(t=>t?{def, pos:{x:e.clientX,y:e.clientY}}:t)}
              onMouseLeave={()=>setTt(null)}
              onClick={()=>{ if(disabled){notify('Not enough funds!','error');snd('error');return;} S.sel=S.sel===key?null:key; snd('select'); emit(); }}>
              <span className="icon">{def.ic}</span>
              <span className="name">{def.n}</span>
              <span className="cost" style={{color:costTxt==='Free'?'var(--ok)':'var(--gold)'}}>{costTxt}</span>
            </div>
          );
        })}
      </div>
      {tt && <Tooltip def={tt.def} pos={tt.pos} />}
    </div>
  );
}

function StatsPanel({g}){
  const bar=(v,col)=>(<div className="demand-bar"><div className="demand-fill" style={{width:(v*100)+'%', background:col}}></div></div>);
  return (
    <div className="statsPanel">
      <div className="stat-row"><span className="label">Buildings</span><span className="val">{g.bCount}</span></div>
      <div className="stat-row"><span className="label">Expansions</span><span className="val">{g.expansions} / 100</span></div>
      <div className="stat-row"><span className="label">Tiles</span><span className="val">{g.tiles}</span></div>
      <div className="stat-row"><span className="label">Time</span><span className="val">{g.isNight?'🌙 Night':'☀️ Day'}</span></div>
      <div className="stat-row"><span className="label">Zoom</span><span className="val">{Math.round(g.zoom*100)}%</span></div>
      <div className="stat-row"><span className="label">Power</span><span className="val" style={{color:g.crisis?'var(--err)':g.powerRatio<1?'var(--warn)':'var(--ok)'}}>{g.crisis?'BLACKOUT':g.powerRatio<1?Math.round(g.powerRatio*100)+'%':'OK'}</span></div>
      <div className="stat-row"><span className="label">Water</span><span className="val" style={{color:g.dying?'var(--err)':'var(--ok)'}}>{g.dying?'SHORTAGE':'OK'}</span></div>
      {g.protesters>0 && <div className="stat-row"><span className="label">🪧 Protesters</span><span className="val" style={{color:'var(--err)'}}>{g.protesters}</span></div>}
      {g.units>0 && <div className="stat-row"><span className="label">🚓 Units</span><span className="val" style={{color:'var(--accent)'}}>{g.units}</span></div>}
      <div className="demand">
        <div className="demand-row"><span className="dl" style={{color:'#34d399'}}>R</span>{bar(g.demand.r,'#34d399')}</div>
        <div className="demand-row"><span className="dl" style={{color:'#38bdf8'}}>C</span>{bar(g.demand.c,'#38bdf8')}</div>
        <div className="demand-row"><span className="dl" style={{color:'#fbbf24'}}>I</span>{bar(g.demand.i,'#fbbf24')}</div>
      </div>
    </div>
  );
}

function Toasts({g}){
  return (
    <div className="toastWrap">
      {g.toasts.map(t=>(<div key={t.id} className={"toast "+t.type}>{t.msg}</div>))}
    </div>
  );
}

function Achievements({g}){
  return (
    <div className="achPanel">
      {g.achievements.map(a=>(<div key={a.id} className="ach"><span style={{fontSize:'16px'}}>{a.ic}</span> {a.label}</div>))}
    </div>
  );
}

function Help({onClose}){
  return (
    <div className="helpOverlay" onClick={onClose}>
      <div className="helpContent pointer" onClick={e=>e.stopPropagation()}>
        <h2>Welcome to SkyGrid ⬡ <span style={{fontSize:'13px',color:'var(--mute)'}}>React Edition</span></h2>
        <p>🏗️ Select a building, then <strong>click the grid</strong> to place it. Click-drag to place many.</p>
        <p>🚗 Build <strong>Roads</strong> from houses — citizens spawn and walk along them.</p>
        <p>⚡ <strong>Power matters:</strong> go below 0 and everything slows (less income). At <strong>−50 it's a BLACKOUT</strong> — no income and happiness bleeds −7 every 2s. Get power back fast or you're cooked.</p>
        <p>😊 <strong>Happiness runs −1,000 → +1,000</strong> and multiplies income. Below −30 you lose 20% income and burn 30% more power.</p>
        <p>💧 <strong>Water!</strong> Every citizen drinks <strong>2/sec</strong>. Build pumps (🚱 Pump, 🚰 Tower, 🏗️ Plant). If the meter goes negative, citizens <strong>die — 10/sec, or 100/sec below −50</strong>. Watch the 💧 meter by your funds.</p>
        <p>🪧 <strong>Unhappy cities riot!</strong> Protesters march in and lob <strong>molotovs</strong> to torch buildings (they love schools). Keep happiness <strong>≥ 700 for zero protests</strong>. From the <strong>🔧 Tools</strong> tab, <strong>summon units anywhere</strong> — they live <strong>2 minutes</strong> (hover one to see its timer): <kbd>🚓 Police</kbd> $150 arrest one-by-one (−1 😊) or <kbd>🪖 Soldier</kbd> $4,000 wipe whole crowds (every kill <em>halves</em> happiness).</p>
        <p>⬛ <strong>Mega-builds</strong> (Nuclear, Stadium, Airport, Arcology, Spaceport, Reservoir…) take a <strong>2×2</strong> footprint. 💧 Water buildings make <strong>+50%</strong> when placed next to water.</p>
        <p>🔍 <strong>Hover any placed building</strong> to see its stats. 🗺️ Expand • 📊 R/C/I demand • 🏆 achievements.</p>
        <p>🖱️ <kbd>Right-drag</kbd>/<kbd>WASD</kbd> pan • <kbd>Scroll</kbd> zoom • <kbd>Space</kbd> pause • <kbd>G</kbd> grid • <kbd>Esc</kbd> deselect • <kbd>Ctrl+Z</kbd> undo.</p>
        <button className="close-help" onClick={onClose}>Got it!</button>
      </div>
    </div>
  );
}

function BuildingHoverTooltip({g}){
  const hb=g.hoverB; if(!hb) return null;
  return <Tooltip def={hb.def} pos={{x:hb.x, y:hb.y+40}} />;
}

function UnitHoverTooltip({g}){
  const u=g.hoverUnit; if(!u) return null;
  const m=Math.floor(u.life/60), s=u.life%60;
  return (
    <div className="tooltip" style={{left:u.x+14, top:u.y-40}}>
      <div className="tt-name">{u.kind==='soldier'?'🪖 Soldier':'🚓 Riot Police'}</div>
      <div className="tt-stats"><span className="tt-stat">⏱ {m}:{String(s).padStart(2,'0')} left</span></div>
    </div>
  );
}

function AlertBanner({g}){
  return (
    <div className="alertBanner">
      {g.dying && <div className="alert crisis">💧 WATER SHORTAGE — citizens dying at {g.water<=-50?100:10}/sec! Build pumps (Utility tab).</div>}
      {g.crisis && <div className="alert crisis">⛔ BLACKOUT — no income, happiness draining! Add power NOW.</div>}
      {g.protestActive && <div className="alert protest">🪧 {g.protesters} protester{g.protesters===1?'':'s'} rioting — deploy 🚓 Police or 🪖 Soldiers (Tools tab)</div>}
    </div>
  );
}

function MobileNav(){
  return (
    <div className="mobileNav">
      <button className="mnav-btn" title="Zoom in" onClick={()=>{initA();zoomBy(1.25);}}>＋</button>
      <button className="mnav-btn" title="Zoom out" onClick={()=>{initA();zoomBy(0.8);}}>－</button>
      <button className="mnav-btn" title="Recenter on city" onClick={()=>{initA();recenter();}}>⊙</button>
    </div>
  );
}

function App(){
  const g=useGame();
  const [help,setHelp]=useState(true);
  const [saveOpen,setSaveOpen]=useState(false);
  useEffect(()=>{
    window.__toggleHelp=()=>setHelp(h=>!h);
    if(!window.__engineStarted){ window.__engineStarted=true; engineInit(); }
  },[]);
  useEffect(()=>{
    const close=e=>{ if(!e.target.closest('.saveMenu')) setSaveOpen(false); };
    if(saveOpen){ document.addEventListener('click',close); return ()=>document.removeEventListener('click',close); }
  },[saveOpen]);
  return (
    <React.Fragment>
      <div className="gameTitle">
        <h1>⬡ SkyGrid</h1>
        <span className="version">React v2.0</span>
        {g.sandbox && <span className="badge-sandbox">✦ Sandbox</span>}
      </div>
      <TopBar g={g} />
      <Controls g={g} onHelp={()=>setHelp(true)} onSaveMenu={(e)=>{e.stopPropagation();setSaveOpen(o=>!o);}} />
      {saveOpen ? <SaveMenu onClose={()=>setSaveOpen(false)} /> : <SpeedBar g={g} />}
      <StatsPanel g={g} />
      <div className="minimap"><canvas id="minimapCanvas"></canvas></div>
      <Achievements g={g} />
      <AlertBanner g={g} />
      <BuildingHoverTooltip g={g} />
      <UnitHoverTooltip g={g} />
      <Palette g={g} />
      <MobileNav />
      <Toasts g={g} />
      {help && <Help onClose={()=>setHelp(false)} />}
      <input type="file" id="fileInput" accept=".json,.skygrid" style={{display:'none'}}
        onChange={e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=ev=>deserialize(ev.target.result); rd.readAsText(f); e.target.value=''; }} />
    </React.Fragment>
  );
}

buildSnapshot(); // ensure a valid snapshot exists before first render
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
// engine is started from App's useEffect, after the minimap canvas is committed to the DOM
</script>

<script>
// Bootstrap: transform the JSX app with the CLASSIC runtime (avoids ESM import emission).
(function(){
  try {
    var code = document.getElementById('appCode').textContent;
    var out = Babel.transform(code, { presets: [['react', { runtime: 'classic' }]] }).code;
    (0, eval)(out);
  } catch (e) {
    console.error('SkyGrid bootstrap error:', e);
    document.body.insertAdjacentHTML('beforeend',
      '<pre style="position:fixed;inset:20px;z-index:9999;background:#111;color:#f87171;padding:20px;overflow:auto;border-radius:12px;font-family:monospace;font-size:13px">'+
      (e && e.message ? e.message : e)+'</pre>');
  }
})();
</script>
</body>
</html>
